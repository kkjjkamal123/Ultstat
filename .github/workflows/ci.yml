name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen swiftlint
      - name: Lint
        run: swiftlint --strict --quiet
      - name: Package tests
        working-directory: Packages/UltstatCore
        run: swift test
      - name: Generate project
        run: xcodegen generate
      - name: Build (Release)
        run: xcodebuild -project Ultstat.xcodeproj -scheme Ultstat -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY=- build
